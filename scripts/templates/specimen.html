<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="embedded-font-sha256" content="$font_hash">
  <title>$display_family — 字形見本</title>
  <style>
$styles
  </style>
</head>
<body>
  <header>
    <h1>$display_family / $family</h1>
    <p>バージョン $version · $character_count文字 · $glyph_countグリフ（縦組み用$vertical_count字形）</p>
  </header>
  <main>
    <section aria-labelledby="sample-heading">
      <h2 id="sample-heading">横組みの試し打ち</h2>
      <p>文章をクリックして編集できます。未収録文字はフォールバック表示になります。</p>
      <label for="sample-size">試し打ちの文字サイズ</label>
      <input id="sample-size" type="range" min="24" max="160" value="$sample_size">
      <output id="sample-size-value" for="sample-size">${sample_size}px</output>
      <div class="sample" contenteditable="true" spellcheck="false" role="textbox" aria-label="横組みの試し打ち" aria-multiline="true">山川草木　天地日月<br>はるの山、風と鳥の声。</div>
    </section>
    <p class="catalog-note">収録文字と縦組み字形を同じ縮尺の枠で表示しています。空白も一枠として表示し、結合濁点は単独の字形を表示します。</p>
$definitions
$sections
  </main>
  <script>
$script
  </script>
</body>
</html>
